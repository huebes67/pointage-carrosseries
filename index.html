<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <title>Pointage Carrosseries</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pointage">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">PC</div>
      <div>
        <div class="brand-title" id="pageTitle">Atelier</div>
        <div class="brand-sub" id="syncInfo">—</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnRefresh" aria-label="Actualiser">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="Réglages">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main id="main">
    <!-- Atelier -->
    <section class="view" id="view-home">
      <div class="kpis" id="kpis"></div>
      <div class="section-head">
        <h2>À fabriquer</h2>
        <div class="legend">
          <span><i class="dot ok"></i>≥ 5 j</span>
          <span><i class="dot warn"></i>2–4 j</span>
          <span><i class="dot hot"></i>0–1 j</span>
          <span><i class="dot late"></i>retard</span>
        </div>
      </div>
      <div id="todoList" class="cards"></div>
      <div class="section-head"><h2>Dernières faites</h2></div>
      <div id="recentList" class="rows"></div>
    </section>

    <!-- Historique -->
    <section class="view" id="view-history" hidden>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Modèle, client, couleur, note…" autocomplete="off">
      </div>
      <div class="chips" id="statusChips">
        <button class="chip active" data-status="all">Toutes</button>
        <button class="chip" data-status="todo">À faire</button>
        <button class="chip" data-status="done">Faites</button>
      </div>
      <div class="result-count" id="resultCount"></div>
      <div id="historyList" class="rows"></div>
      <div id="historySentinel" class="sentinel"></div>
    </section>

    <!-- Stats -->
    <section class="view" id="view-stats" hidden>
      <div class="panel">
        <div class="panel-head"><h2>Commandes par mois</h2><span class="muted">12 derniers mois</span></div>
        <div id="chartMonths"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Top modèles</h2>
          <div class="seg" id="topRange">
            <button data-range="365" class="active">1 an</button>
            <button data-range="all">Tout</button>
          </div>
        </div>
        <div id="chartModels"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Couleurs</h2><span class="muted">1 an</span></div>
        <div id="chartColors"></div>
      </div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="Nouvelle commande">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Atelier</span>
    </button>
    <button class="tab" data-view="history">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>Historique</span>
    </button>
    <button class="tab" data-view="stats">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <!-- Feuille modale (détail / formulaire / réglages) -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-grip"></div>
    <div id="sheetBody"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- Écran de démarrage -->
  <div class="welcome" id="welcome" hidden>
    <div class="welcome-inner">
      <div class="logo big">PC</div>
      <h1>Pointage Carrosseries</h1>
      <p>Ton tableau de fabrication, dans ta poche.</p>
      <button class="btn primary" id="btnCode">Entrer le code d'accès</button>
      <label class="btn ghost file-btn">
        Ouvrir un fichier Excel du téléphone
        <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
      </label>
      <p class="tiny" id="welcomeHint"></p>
    </div>
  </div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
